name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes the older run on the same PR or on main. Each main commit contains every earlier
# one (squash merges), so the newest run still checks them all, and the account's 5 concurrent macOS
# runners are not spent on a commit that is already behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Whether this run needs the full macOS and Windows browser suites. They run on every push to main, and on a pull
    # request unless every file it changes is on a short list known not to affect them (docs, the site, issue
    # templates, license files, and Markdown outside the code and test folders). A path that is not on the list runs them. So does the `native-ci` label, read
    # from the API when the job runs, so re-running all jobs after adding it is enough. If the job cannot tell (an API
    # call fails, or the job fails), the suites run.
    name: Native suites needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.decide.outputs.native }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          run_native() {
            echo "$1"
            echo native=true >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT" = pull_request ] || run_native "A push: the native suites run."
          labels=$(gh api --paginate "repos/$REPO/issues/$PR/labels" --jq '.[].name') ||
            run_native "Could not read the PR's labels: the native suites run."
          if printf '%s\n' "$labels" | grep -qx native-ci; then
            run_native "The PR has the native-ci label: the native suites run."
          fi
          # A rename counts under its old path too. The API lists at most 3000 files; a PR that large runs them.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') ||
            run_native "Could not read the PR's files: the native suites run."
          [ -n "$files" ] || run_native "The PR lists no files: the native suites run."
          [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ] || run_native "The PR changes 3000 files or more: the native suites run."
          safe='^(docs/|site/|\.github/ISSUE_TEMPLATE/)|\.md$|(^|/)(LICENSE|LICENCE|COPYING|NOTICE)([.-][^/]*)?$'
          # Markdown under the code and test folders can be test data (tests/fixtures/conflicts), so it is not safe.
          code='^(tests|src|lib|components|scripts|resources|extensions)/'
          others=$( (printf '%s\n' "$files" | grep -Ev "$safe"; printf '%s\n' "$files" | grep -E "$code") | sort -u)
          if [ -n "$others" ]; then
            echo "These files are not on the list that skips the native suites:"
            printf '%s\n' "$others" | sed -n '1,20p'
            run_native "The native suites run."
          fi
          echo "Every changed file is documentation or similar: the native suites are skipped. Add the native-ci label to run them."
          echo native=false >> "$GITHUB_OUTPUT"

  check:
    # Preserve the existing required-check names.
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - run: npx tsc --noEmit
      # Windows runs the unit tests in the two `Unit tests (windows-latest n/2)` jobs instead.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: npm test
      - name: Startup bundle
        if: runner.os == 'Linux'
        run: npm run check:startup-bundle
      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Electron integration smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron-smoke
      - name: Electron integration smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:electron-smoke
      - name: Browser suite shards cover every suite
        if: runner.os == 'Linux'
        run: |
          node scripts/run-browser-suites.mjs --verify 6
          node scripts/run-browser-suites.mjs --verify 4 --weights scripts/browser-suite-durations-macos.json
          node scripts/run-browser-suites.mjs --verify 5 --weights scripts/browser-suite-durations-windows.json
      - name: Browser smoke (PR, macOS / Windows)
        if: github.event_name == 'pull_request' && runner.os != 'Linux'
        run: npm run test:browser-smoke
      - name: Native swipe navigation (PR, macOS)
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        run: node scripts/test-workbench.mjs --navigation-swipe

  browser:
    # The full Linux browser suite, split into shards balanced by measured suite durations
    # (scripts/browser-suite-durations.json). A failed shard reruns on its own.
    name: Browser (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Browser suites
        # Shared runners are about twice as slow as a quiet machine; see tests/perf-budget.ts.
        env:
          GNOSIS_PERF_BUDGET_SCALE: '2'
        run: xvfb-run -a node scripts/run-browser-suites.mjs --shard ${{ matrix.shard }}/6 --durations browser-suite-durations-${{ matrix.shard }}.json
      - name: Upload suite durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-durations-${{ matrix.shard }}
          path: browser-suite-durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  unit-windows:
    # npm test on Windows, in two halves. Spawning git is slow there: the conflict-resolution tests alone ran for 16
    # minutes when Check ran npm test. scripts/run-unit-tests.mjs gives each half half of the other files, and half of
    # the tests of each file that uses tests/support/test-part.ts.
    name: Unit tests (windows-latest ${{ matrix.shard }}/2)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Unit tests
        run: node scripts/run-unit-tests.mjs --shard ${{ matrix.shard }}/2

  native-browser:
    # The full browser suite on macOS and Windows: on pushes to main, and on pull requests unless `changes` finds only
    # documentation-like files (see there). Those pull requests run the smoke suite in Check. The shards
    # are balanced by each platform's measured durations (scripts/browser-suite-durations-<platform>.json); their
    # counts must match NATIVE_SHARDS in scripts/run-browser-suites.mjs. macOS gets 4 shards: the account runs at most
    # 5 macOS jobs at once, and Check and Package take one each.
    name: Browser (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    # Only an explicit `false` skips them: a failed or cancelled gate leaves no output, and the suites run.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macos, shards: 4, shard: 1 }
          - { os: macos-latest, platform: macos, shards: 4, shard: 2 }
          - { os: macos-latest, platform: macos, shards: 4, shard: 3 }
          - { os: macos-latest, platform: macos, shards: 4, shard: 4 }
          - { os: windows-latest, platform: windows, shards: 5, shard: 1 }
          - { os: windows-latest, platform: windows, shards: 5, shard: 2 }
          - { os: windows-latest, platform: windows, shards: 5, shard: 3 }
          - { os: windows-latest, platform: windows, shards: 5, shard: 4 }
          - { os: windows-latest, platform: windows, shards: 5, shard: 5 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Browser suites
        # Shared runners are about twice as slow as a quiet machine; see tests/perf-budget.ts. Hosted macOS runners
        # vary much more from run to run, so they get more room; the Linux shards on every PR guard the exact budgets.
        env:
          GNOSIS_PERF_BUDGET_SCALE: ${{ matrix.os == 'macos-latest' && '3' || '2' }}
        run: >-
          node scripts/run-browser-suites.mjs --shard ${{ matrix.shard }}/${{ matrix.shards }}
          --weights scripts/browser-suite-durations-${{ matrix.platform }}.json
          --durations browser-suite-durations-${{ matrix.platform }}-${{ matrix.shard }}.json
      - name: Upload suite durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-durations-${{ matrix.platform }}-${{ matrix.shard }}
          path: browser-suite-durations-${{ matrix.platform }}-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  extension:
    # Builds the "Open in Gnosis" browser extension (extensions/browser) and uploads the unsigned packages.
    # Its unit and DOM tests run in Check with `npm test`. No publishing and no store credentials here.
    name: Browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      # web-ext is not a dev dependency (it brings a large, older dependency tree); run it on demand.
      - name: Lint the Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist-extension/firefox --warnings-as-errors
      - name: Upload Chrome and Edge package
        uses: actions/upload-artifact@v4
        with:
          name: open-in-gnosis-chrome-${{ github.sha }}
          path: dist-extension/open-in-gnosis-chrome-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: open-in-gnosis-firefox-${{ github.sha }}
          path: dist-extension/open-in-gnosis-firefox-*.xpi
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Match release packaging: the RPM maker needs the older rpmbuild layout.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      # PR builds must not use signing, notarization, publishing, or OAuth secrets.
      APPLE_TEAM_ID: ''
      APPLE_ID: ''
      APPLE_ID_PASSWORD: ''
      GH_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - name: Build unsigned app and installers
        env:
          # Vite bundling exceeds the default 2 GB heap on macOS arm64.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run make
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: gnosis-unsigned-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 7
