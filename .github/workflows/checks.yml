name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes the older run on the same PR or on main. Each main commit contains every earlier
# one (squash merges), so the newest run still checks them all, and the account's 5 concurrent macOS
# runners are not spent on a commit that is already behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Preserve the existing required-check names.
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - run: npx tsc --noEmit
      - run: npm test
      - name: Startup bundle
        if: runner.os == 'Linux'
        run: npm run check:startup-bundle
      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Electron integration smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron-smoke
      - name: Electron integration smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:electron-smoke
      - name: Browser suite shards cover every suite
        if: runner.os == 'Linux'
        run: |
          node scripts/run-browser-suites.mjs --verify 6
          node scripts/run-browser-suites.mjs --verify 3
      - name: Browser smoke (PR, macOS / Windows)
        if: github.event_name == 'pull_request' && runner.os != 'Linux'
        run: npm run test:browser-smoke
      - name: Native swipe navigation (PR, macOS)
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        run: node scripts/test-workbench.mjs --navigation-swipe

  browser:
    # The full Linux browser suite, split into shards balanced by measured suite durations
    # (scripts/browser-suite-durations.json). A failed shard reruns on its own.
    name: Browser (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Browser suites
        run: xvfb-run -a node scripts/run-browser-suites.mjs --shard ${{ matrix.shard }}/6 --durations browser-suite-durations-${{ matrix.shard }}.json
      - name: Upload suite durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-durations-${{ matrix.shard }}
          path: browser-suite-durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  native-browser:
    # The full browser suite on macOS and Windows, on pushes to main only (pull requests run the smoke
    # suite in Check). Run serially it outgrew the 45-minute job limit, so it is split like Linux.
    name: Browser (${{ matrix.os }} ${{ matrix.shard }}/3)
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Browser suites
        run: node scripts/run-browser-suites.mjs --shard ${{ matrix.shard }}/3

  extension:
    # Builds the "Open in Gnosis" browser extension (extensions/browser) and uploads the unsigned packages.
    # Its unit and DOM tests run in Check with `npm test`. No publishing and no store credentials here.
    name: Browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      # web-ext is not a dev dependency (it brings a large, older dependency tree); run it on demand.
      - name: Lint the Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist-extension/firefox --warnings-as-errors
      - name: Upload Chrome and Edge package
        uses: actions/upload-artifact@v4
        with:
          name: open-in-gnosis-chrome-${{ github.sha }}
          path: dist-extension/open-in-gnosis-chrome-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: open-in-gnosis-firefox-${{ github.sha }}
          path: dist-extension/open-in-gnosis-firefox-*.xpi
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Match release packaging: the RPM maker needs the older rpmbuild layout.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      # PR builds must not use signing, notarization, publishing, or OAuth secrets.
      APPLE_TEAM_ID: ''
      APPLE_ID: ''
      APPLE_ID_PASSWORD: ''
      GH_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - name: Build unsigned app and installers
        env:
          # Vite bundling exceeds the default 2 GB heap on macOS arm64.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run make
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: gnosis-unsigned-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 7
