name: Checks

on:
  pull_request:
    # ready_for_review: a draft marked ready runs again, now with the macOS and Windows suites (see `changes`).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes the older run on the same PR or on main. Each main commit contains every earlier
# one (squash merges), so the newest run still checks them all, and the account's 5 concurrent macOS
# runners are not spent on a commit that is already behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # What this run needs, from the files it changes (scripts/ci-changes.mjs): the app's checks, the website build, the
    # browser extension build, and the full macOS and Windows browser suites. Documentation alone runs nothing, and the
    # website alone runs only its build. Only known paths skip a part: any other path, a change to dependencies or to
    # this workflow, the `native-ci` label, or a list the job cannot read, runs everything. The label is read from the
    # API when the job runs, so re-running all jobs after adding it is enough.
    #
    # A pull request's files come from the API; a push to main compares it with the commit before. The macOS and
    # Windows suites run on every push to main that changes the app, and on a ready pull request that does; a draft
    # runs the Linux suites only.
    name: Which checks run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.decide.outputs.app }}
      site: ${{ steps.decide.outputs.site }}
      extension: ${{ steps.decide.outputs.extension }}
      native: ${{ steps.decide.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-changes.mjs
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Actions runs this with bash -e. A grep that matches nothing must not end the step, so -e is off;
          # every failure path below decides on its own, and fails open to running everything.
          set +e -uo pipefail
          everything() {
            echo "$1"
            printf 'app=true\nsite=true\nextension=true\nnative=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = pull_request ]; then
            labels=$(gh api --paginate "repos/$REPO/issues/$PR/labels" --jq '.[].name') ||
              everything "Could not read the PR's labels: everything runs."
            if printf '%s\n' "$labels" | grep -qx native-ci; then
              everything "The PR has the native-ci label: everything runs."
            fi
            # A rename counts under its old path too. The API lists at most 3000 files; a PR that large runs everything.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') ||
              everything "Could not read the PR's files: everything runs."
            [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ] || everything "The PR changes 3000 files or more: everything runs."
          else
            # A push to main: what changed since the commit before it. A new branch has no commit before.
            case "$BEFORE" in '' | 0000000000000000000000000000000000000000) everything "Nothing to compare the push with: everything runs." ;; esac
            compare=$(gh api "repos/$REPO/compare/$BEFORE...$SHA") || everything "Could not compare the push with the commit before: everything runs."
            # The compare API lists at most 300 files.
            [ "$(jq '.files | length' <<<"$compare")" -lt 300 ] || everything "The push changes 300 files or more: everything runs."
            files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$compare") ||
              everything "Could not read the push's files: everything runs."
          fi
          [ -n "$files" ] || everything "No changed files are listed: everything runs."
          echo "Changed files:"
          printf '%s\n' "$files" | sed -n '1,30p'
          needs=$(printf '%s\n' "$files" | node scripts/ci-changes.mjs) || everything "Could not sort the changed files: everything runs."
          [ -n "$needs" ] || everything "Sorting the changed files gave no answer: everything runs."
          printf '%s\n' "$needs" | tee -a "$GITHUB_OUTPUT"
          if ! printf '%s\n' "$needs" | grep -qx app=true; then
            echo "No app change: the app's checks, and the macOS and Windows browser suites, are skipped."
            echo native=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$EVENT" = pull_request ] || { echo "A push that changes the app: the macOS and Windows browser suites run."; echo native=true >> "$GITHUB_OUTPUT"; exit 0; }
          # A draft runs the Linux suites only, so iterating on a PR doesn't spend macOS and Windows runners. Marking it
          # ready for review runs everything once more (ready_for_review above), before it can be merged. Read live, so a
          # re-run after marking it ready sees it. If the state can't be read, the suites run.
          draft=$(gh api "repos/$REPO/pulls/$PR" --jq .draft) || { echo "Could not read whether the PR is a draft: the macOS and Windows suites run."; echo native=true >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$draft" = true ]; then
            echo "A draft PR: only the Linux suites run. Mark it ready for review to run the macOS and Windows suites."
            echo native=false >> "$GITHUB_OUTPUT"
          else
            echo native=true >> "$GITHUB_OUTPUT"
          fi

  check:
    # Preserve the existing required-check names.
    name: Check (${{ matrix.os }})
    needs: changes
    # Only an explicit `false` skips it: a failed or cancelled gate leaves no output, and it runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - run: npx tsc --noEmit
      # Windows runs the unit tests in the two `Unit tests (windows-latest n/2)` jobs instead.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: npm test
      - name: Startup bundle
        if: runner.os == 'Linux'
        run: npm run check:startup-bundle
      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Electron integration smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron-smoke
      - name: Electron integration smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:electron-smoke
      - name: Browser suite shards cover every suite
        if: runner.os == 'Linux'
        run: |
          node scripts/run-browser-suites.mjs --verify 6
          node scripts/run-browser-suites.mjs --verify 4 --weights scripts/browser-suite-durations-macos.json
          node scripts/run-browser-suites.mjs --verify 2 --weights scripts/browser-suite-durations-macos.json
          node scripts/run-browser-suites.mjs --verify 5 --weights scripts/browser-suite-durations-windows.json
      - name: Browser smoke (PR, macOS / Windows)
        if: github.event_name == 'pull_request' && runner.os != 'Linux'
        run: npm run test:browser-smoke
      - name: Native swipe navigation (PR, macOS)
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        run: node scripts/test-workbench.mjs --navigation-swipe

  browser:
    # The full Linux browser suite, split into shards balanced by measured suite durations
    # (scripts/browser-suite-durations.json). A failed shard reruns on its own.
    name: Browser (shard ${{ matrix.shard }}/6)
    needs: changes
    # Only an explicit `false` skips it: a failed or cancelled gate leaves no output, and it runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Browser suites
        # Shared runners are about twice as slow as a quiet machine; see tests/perf-budget.ts.
        env:
          GNOSIS_PERF_BUDGET_SCALE: '2'
        run: xvfb-run -a node scripts/run-browser-suites.mjs --shard ${{ matrix.shard }}/6 --durations browser-suite-durations-${{ matrix.shard }}.json
      - name: Upload suite durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-durations-${{ matrix.shard }}
          path: browser-suite-durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  unit-windows:
    # npm test on Windows, in two halves. Spawning git is slow there: the conflict-resolution tests alone ran for 16
    # minutes when Check ran npm test. scripts/run-unit-tests.mjs gives each half half of the other files, and half of
    # the tests of each file that uses tests/support/test-part.ts.
    name: Unit tests (windows-latest ${{ matrix.shard }}/2)
    needs: changes
    # Only an explicit `false` skips it: a failed or cancelled gate leaves no output, and it runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Unit tests
        run: node scripts/run-unit-tests.mjs --shard ${{ matrix.shard }}/2

  native-browser:
    # The full browser suite on macOS and Windows: on pushes to main and ready pull requests that change the app (see
    # `changes`). A draft runs the smoke suite in Check instead. The shards
    # are balanced by each platform's measured durations (scripts/browser-suite-durations-<platform>.json); their
    # counts must match NATIVE_SHARDS (main) and NATIVE_PR_SHARDS (pull requests) in scripts/run-browser-suites.mjs.
    # The account runs at most 5 macOS jobs at once, and Check and Package take one each.
    name: Browser (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    # Only an explicit `false` skips them: a failed or cancelled gate leaves no output, and the suites run.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' && needs.changes.outputs.native != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: 2 longer macOS shards (NATIVE_PR_SHARDS), so a few PRs at once fit the 5 macOS runners and no
        # job waits in the queue until it is cancelled. Pushes to main: 4 shards (NATIVE_SHARDS).
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"macos-latest","platform":"macos","shards":2,"shard":1,"timeout":65},{"os":"macos-latest","platform":"macos","shards":2,"shard":2,"timeout":65},{"os":"windows-latest","platform":"windows","shards":5,"shard":1,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":2,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":3,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":4,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":5,"timeout":35}]' || '[{"os":"macos-latest","platform":"macos","shards":4,"shard":1,"timeout":35},{"os":"macos-latest","platform":"macos","shards":4,"shard":2,"timeout":35},{"os":"macos-latest","platform":"macos","shards":4,"shard":3,"timeout":35},{"os":"macos-latest","platform":"macos","shards":4,"shard":4,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":1,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":2,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":3,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":4,"timeout":35},{"os":"windows-latest","platform":"windows","shards":5,"shard":5,"timeout":35}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - run: npm run prepare:mergiraf
      - name: Browser suites
        # Shared runners are about twice as slow as a quiet machine; see tests/perf-budget.ts. Hosted macOS runners
        # vary much more from run to run, so they get more room; the Linux shards on every PR guard the exact budgets.
        env:
          GNOSIS_PERF_BUDGET_SCALE: ${{ matrix.os == 'macos-latest' && '3' || '2' }}
        run: >-
          node scripts/run-browser-suites.mjs --shard ${{ matrix.shard }}/${{ matrix.shards }}
          --weights scripts/browser-suite-durations-${{ matrix.platform }}.json
          --durations browser-suite-durations-${{ matrix.platform }}-${{ matrix.shard }}.json
      - name: Upload suite durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-durations-${{ matrix.platform }}-${{ matrix.shard }}
          path: browser-suite-durations-${{ matrix.platform }}-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  extension:
    # Builds the "Open in Gnosis" browser extension (extensions/browser) and uploads the unsigned packages.
    # Its unit and DOM tests run in Check with `npm test`. No publishing and no store credentials here.
    name: Browser extension
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.extension != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      # web-ext is not a dev dependency (it brings a large, older dependency tree); run it on demand.
      - name: Lint the Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist-extension/firefox --warnings-as-errors
      - name: Upload Chrome and Edge package
        uses: actions/upload-artifact@v4
        with:
          name: open-in-gnosis-chrome-${{ github.sha }}
          path: dist-extension/open-in-gnosis-chrome-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: open-in-gnosis-firefox-${{ github.sha }}
          path: dist-extension/open-in-gnosis-firefox-*.xpi
          if-no-files-found: error
          retention-days: 14

  site:
    # The website build, as site.yml runs it on main, for a pull request that changes site/ (see `changes`). It runs
    # the docs check first (site/scripts/check-docs.mjs), so docs that no longer match the app fail here, not at deploy.
    name: Website
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.site != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # src/pages/changelog.astro reads the releases; without a token the call is capped at 60 an hour.
          GITHUB_TOKEN: ${{ github.token }}

  package:
    name: Package (${{ matrix.os }})
    needs: changes
    # Only an explicit `false` skips it: a failed or cancelled gate leaves no output, and it runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Match release packaging: the RPM maker needs the older rpmbuild layout.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      # PR builds must not use signing, notarization, publishing, or OAuth secrets.
      APPLE_TEAM_ID: ''
      APPLE_ID: ''
      APPLE_ID_PASSWORD: ''
      GH_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}
      - run: npm ci
      - name: Build unsigned app and installers
        env:
          # Vite bundling exceeds the default 2 GB heap on macOS arm64.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run make
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: gnosis-unsigned-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 7
