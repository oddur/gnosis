name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.30.0 or v0.42.0-beta.1)
        required: true
        type: string
      platform:
        description: Platform to publish
        default: all
        type: choice
        options:
          - all
          - macos-latest
          - windows-latest
          - ubuntu-24.04

permissions:
  contents: write

jobs:
  # The account runs at most 5 macOS jobs at once, and a push to main uses all of them. Cancel Checks runs
  # still in flight so the release's macOS build is not starved; a release is tagged only on a green main.
  free-macos-runners:
    name: Free macOS runners
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel queued and running Checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for status in in_progress queued; do
            gh run list --workflow checks.yml --status "$status" --json databaseId --jq '.[].databaseId' |
              while read -r id; do gh run cancel "$id" || true; done
          done

  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        # The RPM maker requires the pre-RPM-4.20 build-directory layout.
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-latest","windows-latest","ubuntu-24.04"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # Two kinds of tag (docs/releasing.md). lib/version.ts holds the same patterns; tests/version.test.ts compares them.
      # RELEASE_KIND decides the GitHub prerelease flag (forge.config.ts), the release guard and the Homebrew update.
      - name: Validate release tag
        shell: bash
        run: |
          STABLE_TAG='^v[0-9]+\.[0-9]+\.[0-9]+$'
          PRERELEASE_TAG='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]{0,2}$'
          if [[ "$RELEASE_TAG" =~ $STABLE_TAG ]]; then
            echo "RELEASE_KIND=stable" >> "$GITHUB_ENV"
          elif [[ "$RELEASE_TAG" =~ $PRERELEASE_TAG ]]; then
            echo "RELEASE_KIND=prerelease" >> "$GITHUB_ENV"
          else
            echo "Expected a stable tag such as v0.42.0 or a pre-release tag such as v0.42.0-beta.1"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Cache Electron binaries — downloaded during npm ci, large and slow
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # Mergiraf's host (codeberg.org) is not reliable enough to download from on every job.
      # prepare:mergiraf skips the download when this folder already holds the manifest's version.
      - name: Cache Mergiraf
        uses: actions/cache@v4
        with:
          path: resources/mergiraf/runtime
          key: mergiraf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/mergiraf/manifest.json') }}

      - name: Install dependencies
        run: npm ci

      # Sync package.json version with the pushed tag (strips leading 'v')
      - name: Set version from tag
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version

      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Publish
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # forge.config.ts fails before publishing if this disagrees with package.json's version.
          GNOSIS_RELEASE_KIND: ${{ env.RELEASE_KIND }}
        run: npm run publish

      # A stable user must never be offered a prerelease, and update.electronjs.org serves every release that is not
      # flagged prerelease. Check the flag every job published under; if a pre-release tag is not flagged, flag it and fail.
      - name: Check the release's prerelease flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          IS_PRERELEASE="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)"
          EXPECTED=false
          if [ "$RELEASE_KIND" = prerelease ]; then EXPECTED=true; fi
          if [ "$IS_PRERELEASE" != "$EXPECTED" ]; then
            echo "::error::$RELEASE_TAG is a $RELEASE_KIND tag, but its GitHub release has isPrerelease=$IS_PRERELEASE."
            if [ "$RELEASE_KIND" = prerelease ]; then gh release edit "$RELEASE_TAG" --prerelease; fi
            exit 1
          fi

      # Squirrel.Mac on the Pre-release channel reads this manifest (lib/updater.ts, macUpdateManifestName). Stable users
      # read update.electronjs.org and never see it.
      - name: Upload the macOS update manifest
        if: runner.os == 'macOS' && env.RELEASE_KIND == 'prerelease'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCH="$(node -p process.arch)"
          ZIP="Gnosis-darwin-${ARCH}-${VERSION}.zip"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$ZIP"
          MANIFEST="$RUNNER_TEMP/Gnosis-darwin-${ARCH}-update.json"
          URL="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/${ZIP}"
          node -e 'const [url, name, file] = process.argv.slice(1); require("fs").writeFileSync(file, JSON.stringify({ url, name, notes: "", pub_date: new Date().toISOString() }))' "$URL" "Gnosis $VERSION" "$MANIFEST"
          cat "$MANIFEST"
          gh release upload "$RELEASE_TAG" "$MANIFEST" --clobber

      - name: Cleanup Apple certificate
        if: runner.os == 'macOS' && always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      # Homebrew only ever receives stable versions.
      - name: Update Homebrew tap
        if: matrix.os == 'macos-latest' && env.RELEASE_KIND == 'stable'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ZIP="Gnosis-darwin-arm64-${VERSION}.zip"
          curl --fail -sL "https://github.com/oddur/gnosis/releases/download/${RELEASE_TAG}/${ZIP}" -o /tmp/gnosis.zip
          SHA=$(shasum -a 256 /tmp/gnosis.zip | awk '{print $1}')
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/oddur/homebrew-gnosis.git" /tmp/homebrew-tap
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" /tmp/homebrew-tap/Casks/gnosis.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" /tmp/homebrew-tap/Casks/gnosis.rb
          cd /tmp/homebrew-tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "chore: bump gnosis to ${VERSION}"
          git push
